<div class="repo p-2 text-center">
  <a href="https://github.com/{{ include.username }}" class="text-decoration-none">
    <div class="repo-card repo-card-user card hoverable">
      <img class="repo-avatar" src="https://github.com/{{ include.username }}.png?size=128" alt="{{ include.username }}" width="112" height="112" loading="lazy" decoding="async">
      <div class="repo-card-body">
        <span class="repo-card-name">{{ include.username }}</span>
      </div>
    </div>
  </a>
</div>
